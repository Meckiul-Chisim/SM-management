<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Haven is a local-first demo for planning social media content: organise brands, draft posts, plan a calendar and track follow-ups. Data stays in your browser."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Haven" />
    <meta property="og:title" content="Haven — Social media workspace" />
    <meta
      property="og:description"
      content="Plan content, organise brands and track follow-ups in one calm workspace. A local-first demo: your data stays in your browser."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Haven — Social media workspace" />
    <meta
      name="twitter:description"
      content="Plan content, organise brands and track follow-ups. A local-first demo."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#f6f7f3" />
    <script>
      // Sets the theme before the first paint, so there is no flash.
      // Keep in sync with src/utils/theme.js (same storage key and rules).
      (function () {
        var theme = null;
        try { theme = localStorage.getItem("haven-theme"); } catch (error) {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').setAttribute("content", theme === "dark" ? "#0f1613" : "#f6f7f3");
      })();
    </script>
    <title>Haven — Social media workspace</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Haven needs JavaScript to run. Please enable it in your browser settings.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
